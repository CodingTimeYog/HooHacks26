services:
  agrisignal:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - db_data:/app/db
      - ./backend:/app/backend      # ← add this line
      - ./app.py:/app/app.py        # ← and this
      - ./pages:/app/pages          # ← and this
      - ./data:/app/data   

    restart: unless-stopped
volumes:
  db_data: